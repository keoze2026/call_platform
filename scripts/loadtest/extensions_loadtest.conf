; CH-465 load test only (Server A). Removed after the test.
; The same steps as [from-carrier] - routing (AGI, Server B or the fallback),
; recording, caller ID, hang-up report - but the buyer leg is dialled to SIPp
; on this server (loadtest-uas), never to a carrier.
;
; CH-469: every step uses the TEST copy, never the live one:
;   routing      route_call_loadtest.py -> test routing on Server B (port
;                8011) and the test fallback state
;                /var/lib/avortyx/fallback-loadtest
;   recordings   /var/spool/asterisk/recordings-loadtest
;   hang-up      call_ended_loadtest.sh -> test routing, test spool
; Installed and removed by scripts/loadtest/a_loadtest.sh.

[loadtest-in]
exten => _X.,1,NoOp(LOADTEST call from ${CALLERID(num)} to ${EXTEN})
 same => n,AGI(route_call_loadtest.py)
 same => n,GotoIf($["${ROUTE_ACTION}" = "dial"]?dial:nobuyer)
 same => n(dial),Set(RECFILE=/var/spool/asterisk/recordings-loadtest/${CALL_LOG_ID}.wav)
 same => n,ExecIf($["${RECORD_CALL}" != "0"]?MixMonitor(${RECFILE},b))
 same => n,Set(CID_DIGITS=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($[${LEN(${CID_DIGITS})} = 10]?Set(CALLERID(num)=+1${CID_DIGITS}))
 same => n,ExecIf($[${LEN(${CID_DIGITS})} = 11 & "${CID_DIGITS:0:1}" = "1"]?Set(CALLERID(num)=+${CID_DIGITS}))
 same => n,Set(DIAL_NUM=${IF($["${BUYER_NUMBER:0:1}" = "+"]?${BUYER_NUMBER:1}:${BUYER_NUMBER})})
 same => n,Dial(PJSIP/${DIAL_NUM}@loadtest-uas,${MAX_DURATION},grb(avx-out-hdr^s^1(${CALL_LOG_ID})))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finished)
 same => n,Hangup(${IF($["${HANGUPCAUSE}" != ""]?${HANGUPCAUSE}:34)})
 same => n(finished),Hangup()
 same => n(nobuyer),Hangup(21)
exten => h,1,Gosub(loadtest-call-end,s,1(${CALL_LOG_ID}))

[loadtest-none]
exten => _X.,1,Hangup(21)

; The live [macro-call_end], with the test recording folder and the test
; hang-up report.
[loadtest-call-end]
exten => s,1,NoOp(LOADTEST call ended for log ${ARG1})
 same => n,Set(RECPATH=)
 same => n,ExecIf($["${RECORD_CALL}" != "0"]?Set(RECPATH=recordings-loadtest/${ARG1}.wav))
 same => n,System(/usr/local/bin/call_ended_loadtest.sh "${ARG1}" "${ANSWEREDTIME}" "${DIALSTATUS}" "${RECPATH}" "${CALLERID(num)}" "${DIALEDTIME}")
 same => n,Return()
