; CH-465 load test only (Server A). Removed after the test.
; SIPp on 127.0.0.2 plays the callers; SIPp on 127.0.0.3:5090 plays the buyers.
; Nothing here reaches a carrier.

[loadtest-in]
type=endpoint
transport=transport-udp
context=loadtest-in
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[loadtest-in-ip]
type=identify
endpoint=loadtest-in
match=127.0.0.2

[loadtest-uas]
type=aor
contact=sip:127.0.0.3:5090

[loadtest-uas]
type=endpoint
transport=transport-udp
context=loadtest-none
aors=loadtest-uas
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes

[loadtest-uas-ip]
type=identify
endpoint=loadtest-uas
match=127.0.0.3
