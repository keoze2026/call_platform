# Nginx rate limiting for avortyx.io
#
# Apply with: bash deploy/apply_nginx_limits.sh
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: the Asterisk callbacks must never be rate limited.
#
# /api/twilio/asterisk/route/       decides where a live call goes
# /api/twilio/asterisk/call-ended/  closes the record and bills the call
#
# Throttling these drops calls. They are protected by a shared secret, not by a
# rate limit, and they come from this machine. They are exempted below - keep it
# that way.
# ─────────────────────────────────────────────────────────────────────────────


# ── http{} — zones and the CORS origin map ───────────────────────────────────

limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=api_login:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=api_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# Echoes the request's origin back, but only for origins we allow. Used on the
# 429 response so a throttled request reaches the browser as a rate limit rather
# than as a CORS failure - the two look identical otherwise, because a request
# rejected before Django runs carries no Access-Control-Allow-Origin at all.
map $http_origin $cors_origin {
    default                     "";
    "https://www.avortyx.com"   $http_origin;
    "https://avortyx.com"       $http_origin;
    "https://avortyx.io"        $http_origin;
    "http://localhost:3000"     $http_origin;
    "http://localhost:3001"     $http_origin;
}


# ── the avortyx.io server{} block ────────────────────────────────────────────

    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  10m;
    server_tokens off;

    # The 429 handler. Kept as a named location so the CORS headers are added
    # only here - adding them on every response would duplicate Django's own and
    # the browser rejects a response carrying two.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Access-Control-Allow-Headers     "Authorization,Content-Type,X-Request-ID" always;
        add_header Retry-After                      1            always;
        return 429 '{"detail":"Too many requests. Please retry shortly.","code":"rate_limited"}';
    }

    # Asterisk first: no limits, whatever follows. ^~ so no regex location can
    # take precedence over it.
    location ^~ /api/twilio/asterisk/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login and password reset: slow, because these get guessed at.
    location ~ ^/api/accounts/(login|verify-mfa|password-reset) {
        limit_req  zone=api_login burst=5 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/.
    #
    # limit_conn was 20, which is a whole office rather than a whole person:
    # colleagues behind one address share it, and a browser opens several
    # connections per tab. 50 is roughly five people working normally and still
    # far below what an attack looks like.
    location /api/ {
        limit_req  zone=api_general burst=60 nodelay;
        limit_conn api_conn 50;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
