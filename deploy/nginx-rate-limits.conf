# Nginx rate limiting for avortyx.io
#
# Include the two zone lines from the http{} block, and the location rules inside
# the existing server{} block for avortyx.io.
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: the Asterisk callbacks must never be rate limited.
#
# /api/twilio/asterisk/route/       decides where a live call goes
# /api/twilio/asterisk/call-ended/  closes the record and bills the call
# /api/twilio/asterisk/active-channels/
#
# Throttling these drops calls. They are protected by a shared secret, not by a
# rate limit, and they come from this machine. They are exempted below - keep it
# that way.
# ─────────────────────────────────────────────────────────────────────────────


# ── put these in http{} ──────────────────────────────────────────────────────

# 10m of state holds roughly 160,000 addresses.
limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=api_login:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=api_conn:10m;

# 429 rather than the default 503: a client can tell it was throttled rather than
# that the service is down, and monitoring can separate the two.
limit_req_status  429;
limit_conn_status 429;


# ── put these in the avortyx.io server{} block ───────────────────────────────

    # Slow-loris: a client that opens a connection and dribbles bytes holds a
    # worker indefinitely. These caps make that cost bounded.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  10m;

    # Do not advertise the version to anyone probing for a matching exploit.
    server_tokens off;

    # Asterisk first: no limits, whatever follows.
    location /api/twilio/asterisk/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login and password reset: slow, because these are guessed at.
    location ~ ^/api/accounts/(login|verify-mfa|password-reset) {
        limit_req  zone=api_login burst=5 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else. burst=60 absorbs a dashboard loading many panels at once;
    # nodelay serves the burst immediately rather than queuing it, so a normal
    # page load is not slowed down.
    location /api/ {
        limit_req  zone=api_general burst=60 nodelay;
        limit_conn api_conn 20;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
