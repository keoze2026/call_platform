services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: call_platform
      POSTGRES_USER: call_platform
      POSTGRES_PASSWORD: changeme_in_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
    # A port range rather than a single port, so `docker compose up -d --scale web=3`
    # gives each replica its own host port (8000, 8001, 8002) for Nginx to balance
    # across. Scaling to 1 still binds 8000 exactly as before.
    ports:
      - "8000-8002:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # Connection pooler. Opt-in: `docker compose --profile pooling up -d pgbouncer`.
  # Only worth running once `web` is scaled past one replica — each web and worker
  # process holds its own Postgres connection (CONN_MAX_AGE=600), and Postgres
  # defaults to 100 total.
  #
  # To route the app through it, set in .env and restart web + workers:
  #   DATABASE_URL=postgresql://call_platform:changeme_in_production@pgbouncer:6432/call_platform
  #   DB_CONN_MAX_AGE=0            # the pooler holds the connections, not Django
  #   DB_DISABLE_SERVER_SIDE_CURSORS=True   # required for transaction pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["pooling"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: call_platform
      DB_PASSWORD: changeme_in_production
      DB_NAME: call_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: