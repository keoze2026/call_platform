; Replaces [macro-call_end] in /etc/asterisk/extensions.conf.
;
; The old line built the recording URL inside ${IF(...)}:
;
;   "${IF($["${RECORD_CALL}" != "0"]?https://avortyx.io/recordings/${ARG1}.wav:)}"
;
; IF splits the true branch from the false branch on the first colon after the
; `?`. The first colon in the URL is the one in `https:`, so the true branch was
; the word `https` and everything after it was parsed as the false branch. That
; is the whole reason every completed call stored the string `https` and the
; portal showed a dead link. ExecIf splits on a colon the same way, so the fix
; is not to put a colon in either of them.
;
; Nothing here carries a scheme or a domain any more. The dialplan sends the
; path, Django puts RECORDING_BASE_URL in front of it, and the recordings
; domain is changed in one place instead of in the dialplan.

[macro-call_end]
exten => s,1,NoOp(Call ended for log ${ARG1})
 same => n,Set(RECPATH=)
 same => n,ExecIf($["${RECORD_CALL}" != "0"]?Set(RECPATH=recordings/${ARG1}.wav))
 same => n,System(/usr/local/bin/call_ended.sh "${ARG1}" "${ANSWEREDTIME}" "${DIALSTATUS}" "${RECPATH}")
 same => n,Return()
