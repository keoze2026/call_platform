; Replaces [macro-call_end]. v2: also passes the caller, so a hangup that
; lost CALL_LOG_ID to a transfer can still be matched to its call.
[macro-call_end]
exten => s,1,NoOp(Call ended for log ${ARG1})
 same => n,Set(RECPATH=)
 same => n,ExecIf($["${RECORD_CALL}" != "0"]?Set(RECPATH=recordings/${ARG1}.wav))
 same => n,System(/usr/local/bin/call_ended.sh "${ARG1}" "${ANSWEREDTIME}" "${DIALSTATUS}" "${RECPATH}" "${CALLERID(num)}")
 same => n,Return()
