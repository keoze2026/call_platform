; [from-carrier] AFTER deploy/no_early_answer.py (CH-137). Reference only: the
; live file is /etc/asterisk/extensions.conf, edited by that script.
;
; Before: Answer() ran first, so the upstream platform saw every call as
; connected the moment it arrived, even when the buyer then declined.
; After: nothing answers the caller until the buyer does. Dial() answers the
; inbound channel when the buyer picks up, and a failed dial hangs up with the
; buyer's own cause so the upstream receives a failed call.
[from-carrier]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,NoOp(no-early-answer: Dial() answers the caller when the buyer answers)
 same => n,AGI(route_call.py)
 same => n,GotoIf($["${ROUTE_ACTION}" = "dial"]?dial:nobuyer)
 same => n(dial),Set(RECFILE=/var/spool/asterisk/recordings/${CALL_LOG_ID}.wav)
 same => n,ExecIf($["${RECORD_CALL}" != "0"]?MixMonitor(${RECFILE},b))
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Set(DIAL_NUM=${IF($["${BUYER_NUMBER:0:1}" = "+"]?${BUYER_NUMBER:1}:${BUYER_NUMBER})})
 same => n,Dial(PJSIP/${DIAL_NUM}@carrier,${MAX_DURATION},gr)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finished)
 same => n,Hangup(${IF($["${HANGUPCAUSE}" != ""]?${HANGUPCAUSE}:34)})
 same => n(finished),Hangup()
 same => n(nobuyer),Playback(vm-goodbye)   ; with --reject-nobuyer: Hangup(21) instead
 same => n,Hangup()
exten => h,1,Gosub(macro-call_end,s,1(${CALL_LOG_ID}))
