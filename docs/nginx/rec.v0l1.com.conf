# Serves the call recordings on the masked domain.
#
# The platform stores recording links under RECORDING_BASE_URL
# (https://rec.v0l1.com). Until nginx serves the folder, every link in the
# export is correct and 404s. This closes that.
#
# Range requests (Accept-Ranges) come with nginx static file serving by
# default; browsers need them to seek inside a recording instead of
# re-downloading it from the start.

server {
    listen 80;
    server_name rec.v0l1.com;

    # Only the recordings, only audio. No directory listing, no fallthrough
    # into anything else on this box.
    location /recordings/ {
        alias /var/spool/asterisk/recordings/;
        autoindex off;

        location ~ \.(wav|mp3)$ {
            # Old links end in .wav. Once a recording is converted to MP3
            # (CH-281) only <id>.mp3 is left, so a .wav link that has no file
            # is answered with the .mp3: links already sent out in exports and
            # buyer reports keep playing. It has to sit here: nginx checks
            # this nested location before any other regex, so a separate
            # block outside /recordings/ was never reached (CH-283).
            if (!-f $request_filename) {
                rewrite ^(/recordings/.+)\.wav$ $1.mp3 last;
            }
            # The portal plays these from app.avortyx.com, so the audio
            # element needs CORS to read duration and seek.
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "private, max-age=3600";
            # Stock nginx mime.types has no entry for wav, so recordings went
            # out as application/octet-stream and the browser's audio element
            # refused to play "a binary file".
            types { audio/wav wav; audio/mpeg mp3; }
            default_type audio/wav;
        }

        # Anything in the folder that is not audio does not exist here.
        return 404;
    }

    location / {
        return 404;
    }
}
