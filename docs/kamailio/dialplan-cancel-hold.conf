; CH-296 - LAB DRAFT. Two changes to [from-carrier] in /etc/asterisk/extensions.conf
; (see docs/asterisk/from-carrier-no-early-answer.conf for the current block).
;
; 1) Before the Dial line: choose the endpoint. Off by default.
;    All calls:      asterisk -rx "database put avortyx cancel_hold 1"
;    One test caller: asterisk -rx "database put avortyx cancel_hold_caller 1XXXXXXXXXX"
;    Off:            asterisk -rx "database del avortyx cancel_hold"
 same => n,Set(OUT_EP=carrier)
 same => n,ExecIf($["${DB(avortyx/cancel_hold)}" = "1"]?Set(OUT_EP=carrier-out))
 same => n,ExecIf($["${DB(avortyx/cancel_hold_caller)}" = "${CALLERID(num):-11}"]?Set(OUT_EP=carrier-out))
;
; 2) The Dial line: the endpoint from above, and our call id on the outbound
;    INVITE so the relay can report a held answer for the right call.
 same => n,Dial(PJSIP/${DIAL_NUM}@${OUT_EP},${MAX_DURATION},grb(avx-out-hdr^s^1(${CALL_LOG_ID})))

[avx-out-hdr]
exten => s,1,Set(PJSIP_HEADER(add,X-Avortyx-Call)=${ARG1})
 same => n,Return()
