; CH-296 - LAB DRAFT. Add to /etc/asterisk/pjsip.conf (or an included file).
; A twin of the existing [carrier] endpoint that sends OUTBOUND calls through
; the cancel-hold relay. [carrier] itself is not touched, so incoming calls
; and every call not switched over behave exactly as today.
;
; Copy every option of [carrier] (pjsip show endpoint carrier) into
; [carrier-out] first, then add the outbound_proxy line.

[carrier-out]
type=endpoint
; ... same options as [carrier] (context, disallow/allow, aors, 100rel, ...)
aors=carrier
outbound_proxy=sip:127.0.0.1:5070\;lr
