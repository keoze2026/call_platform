#!KAMAILIO
#
# Avortyx cancel-hold relay (CH-296) - LAB DRAFT, not live until lab-tested.
#
# Sits between Asterisk and XOLO for OUTBOUND calls only (endpoint
# carrier-out). Passes every message straight through, except one: a CANCEL
# from Asterisk (the caller hung up while the buyer rang) is held HOLD_MS
# before it goes to XOLO. While it is held the path to the buyer stays open,
# so a buyer who picks up in that moment sends a 200 OK that comes back to
# Asterisk (which ACKs and BYEs, as SIP requires) and this relay reports it
# to the backend at once: the call is recorded Answered, 1 second.
#
# Sizing (26 Oct, 29 calls, docs/asterisk/size_cancel_hold.py): 500 ms would
# surely catch 11, 1000 ms 21 (+8 likely), 1500 ms 27, 2000 ms 29.
# CH-315 (27 Oct, the 33 calls Revo corrected 26-27 Oct): every buyer answer
# came 0-2 s after the caller hung up - 22 within 0.5 s, 31 within 1 s, 33
# within 2 s. Revo logs whole seconds, so "+2 s" can be up to 2.9 s: 3000 ms.
# Change it on the server with: bash docs/kamailio/cancel_hold.sh hold <ms>
#
# Incoming calls from XOLO never pass through here (they still reach
# Asterisk on 5060). Switch off = point the dialplan back to "carrier".

#!substdef "!HOLD_MS!3000!g"
#!substdef "!HOLD_US!3000000!g"
#!substdef "!PUBLIC_IP!156.67.25.167!g"
#!substdef "!HELD_URL!http://127.0.0.1:8000/api/twilio/asterisk/held-answer/!g"
#!substdef "!SECRET!__ASTERISK_SHARED_SECRET__!g"

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
fork=yes
children=32
mhomed=1
auto_aliases=no

listen=udp:127.0.0.1:5070      # from Asterisk (outbound_proxy of carrier-out)
listen=udp:PUBLIC_IP:5080      # to and from XOLO

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "htable.so"
loadmodule "cfgutils.so"
loadmodule "http_client.so"

modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)
# Call-ID -> our call id (from the X-Avortyx-Call header Asterisk adds)
modparam("htable", "htable", "avx=>size=10;autoexpire=7200;")
# Call-ID -> a CANCEL is being held
modparam("htable", "htable", "hold=>size=8;autoexpire=120;")
# Call-ID -> the buyer answered during the hold
modparam("htable", "htable", "ans=>size=8;autoexpire=120;")
modparam("http_client", "connection_timeout", 2)
# Buyers may ring for a long time; MAX_DURATION is enforced by Asterisk.
modparam("tm", "fr_inv_timer", 180000)
modparam("tm", "fr_timer", 5000)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        exit;
    }

    if (is_method("CANCEL")) {
        if (!t_check_trans()) {
            exit;
        }
        # Asterisk re-sends its CANCEL every 0.5 s until it gets a 200; those
        # copies are dropped while the first one is held (lab, 27 Oct: the
        # async version held every copy and never sent any).
        if ($sht(hold=>$ci) != $null) {
            exit;
        }
        $sht(hold=>$ci) = 1;
        xlog("L_NOTICE", "hold: [$TV(Sn)] CANCEL for $ci held HOLD_MS ms\n");
        # This worker waits; the other workers keep carrying messages, so a
        # 200 OK from the buyer is passed to Asterisk during the wait. About
        # one CANCEL every few seconds at peak; with a 3 s hold that keeps a
        # few workers waiting at once - 32 workers leaves plenty free.
        usleep(HOLD_US);
        if ($sht(ans=>$ci) != $null) {
            # The buyer answered during the hold. Asterisk already has the
            # 200 OK and is ACKing / hanging up; the CANCEL is not sent on.
            xlog("L_NOTICE", "hold: [$TV(Sn)] $ci answered during the hold - CANCEL not sent\n");
            sl_send_reply("200", "OK");
            exit;
        }
        xlog("L_NOTICE", "hold: [$TV(Sn)] $ci no answer in HOLD_MS ms - CANCEL sent\n");
        t_relay();
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    if (is_method("INVITE")) {
        $sht(avx=>$ci) = $hdr(X-Avortyx-Call);
        remove_hf("X-Avortyx-Call");
        record_route();
        t_on_reply("OUT");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


route[WITHINDLG] {
    if (loose_route()) {
        t_relay();
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    sl_send_reply("404", "Not here");
    exit;
}

onreply_route[OUT] {
    if ($rm == "INVITE" && $rs =~ "^2" && $sht(hold=>$ci) != $null && $sht(ans=>$ci) == $null) {
        $sht(ans=>$ci) = 1;
        xlog("L_NOTICE", "hold: [$TV(Sn)] $ci buyer answered during the hold - reporting\n");
        $var(body) = "{\"call_log_id\": \"" + $sht(avx=>$ci) + "\", \"answered_at_epoch\": " + $TV(s) + "}";
        http_client_query("HELD_URL", "$var(body)",
            "Content-Type: application/json\r\nX-Asterisk-Secret: SECRET", "$var(res)");
    }
}
